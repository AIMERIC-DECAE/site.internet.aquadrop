<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0; url=/site.internet.aquadrop/" />
    <link rel="canonical" href="/site.internet.aquadrop/" />
    <title>Redirection...</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        background-color: #f7f5f0;
        color: #0b3d2e;
      }
    </style>
  </head>
  <body>
    <p>Redirection vers la page d'accueil...</p>
    <script>
      (function () {
        const repoBase = '/site.internet.aquadrop/';
        const redirectUrl = `${repoBase}`;
        if (typeof window !== 'undefined') {
          if (typeof window.location.replace === 'function') {
            window.location.replace(redirectUrl);
          } else {
            window.location.href = redirectUrl;
          }
        }
      })();
    </script>
  </body>
</html>
