<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirection...</title>
    <meta name="robots" content="noindex" />
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        background-color: #f7f5f0;
        color: #0b3d2e;
      }

      .message {
        max-width: 32rem;
        padding: 2rem 2.5rem;
        text-align: center;
        border-radius: 1rem;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 12px 32px rgba(11, 61, 46, 0.16);
      }
    </style>
  </head>
  <body>
    <div class="message">
      <p>Redirection vers la page demandée...</p>
      <noscript>
        JavaScript est requis pour charger correctement cette page. Veuillez
        <a href="/site.internet.aquadrop/">retourner à l'accueil</a>.
      </noscript>
    </div>
    <script>
      (async () => {
        const repoBase = '/site.internet.aquadrop/';
        const { pathname, search, hash } = window.location;
        const relativePath = pathname.startsWith(repoBase)
          ? pathname.slice(repoBase.length)
          : pathname.replace(/^\/+/u, '');

        try {
          const response = await fetch(`${repoBase}index.html`, {
            cache: 'reload',
            redirect: 'follow',
          });

          if (!response.ok) {
            throw new Error(`Impossible de charger index.html (statut ${response.status}).`);
          }

          const html = await response.text();
          document.open('text/html', 'replace');
          document.write(html);
          document.close();

          const trimmedBase = repoBase.endsWith('/') ? repoBase.slice(0, -1) : repoBase;
          const sanitizedRelative = relativePath.replace(/^\/+/u, '');
          const normalizedPath = sanitizedRelative ? `/${sanitizedRelative}` : '/';
          const newPath = `${trimmedBase}${normalizedPath}`;
          window.history.replaceState(null, '', `${newPath}${search}${hash}`);
        } catch (error) {
          console.error('Redirection SPA impossible:', error);
          window.location.replace(`${repoBase}`);
        }
      })();
    </script>
  </body>
</html>
